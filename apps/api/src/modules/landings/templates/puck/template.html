<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{META_TITLE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; }
    *, *::before, *::after { box-sizing: border-box; }
    img, video { max-width: 100%; }
    /* Без скрипта видно только первый шаг — так страницу видит и краулер рекламной сети. */
    [data-pk-step] ~ [data-pk-step] { display: none; }
  </style>
</head>
<body>
{{PUCK_HTML}}
<script>
(function () {
  var steps = Array.prototype.slice.call(document.querySelectorAll('[data-pk-step]'));
  var current = 0;
  var triggered = false;

  function show(el) { el.style.display = el.hasAttribute('data-pk-step') ? 'block' : ''; }
  function hide(el) { el.style.display = 'none'; }

  function openPopups() {
    return Array.prototype.filter.call(document.querySelectorAll('[data-pk-popup]'), function (p) {
      return p.style.display !== 'none' && !p.hasAttribute('data-pk-closed');
    });
  }

  function maybeTrigger() {
    if (triggered) return;
    if (steps.length > 1 && current < steps.length - 1) return;
    if (openPopups().length || document.querySelector('[data-pk-popup][data-pk-pending]')) return;
    if (!window.tcrm || typeof window.tcrm.triggerAutoRedirect !== 'function') return;
    triggered = true;
    window.tcrm.triggerAutoRedirect();
  }

  function goTo(index) {
    if (index < 0 || index >= steps.length) return;
    steps.forEach(function (s, i) { if (i === index) show(s); else hide(s); });
    current = index;
    window.scrollTo(0, 0);
    maybeTrigger();
  }

  function closePopup(p) {
    hide(p);
    p.setAttribute('data-pk-closed', '1');
    maybeTrigger();
  }

  steps.forEach(function (s, i) { if (i === 0) show(s); else hide(s); });

  Array.prototype.forEach.call(document.querySelectorAll('[data-pk-popup]'), function (p) {
    var delay = parseInt(p.getAttribute('data-pk-delay') || '0', 10) || 0;
    if (delay > 0) {
      hide(p);
      p.setAttribute('data-pk-pending', '1');
      setTimeout(function () { p.removeAttribute('data-pk-pending'); show(p); }, delay * 1000);
    }
    if (p.getAttribute('data-pk-dismiss') === '1') {
      p.addEventListener('click', function (e) { if (e.target === p) closePopup(p); });
    }
  });

  document.addEventListener('click', function (e) {
    var target = e.target instanceof Element ? e.target.closest('[data-pk-action]') : null;
    if (!target) return;
    var action = target.getAttribute('data-pk-action');
    if (action !== 'next' && action !== 'close') return;
    e.preventDefault();
    var popup = target.closest('[data-pk-popup]');
    if (action === 'close' || (popup && !target.closest('[data-pk-step]'))) {
      if (popup) closePopup(popup);
      return;
    }
    var step = target.closest('[data-pk-step]');
    var index = step ? steps.indexOf(step) : current;
    if (index + 1 < steps.length) goTo(index + 1);
    else if (popup) closePopup(popup);
  });

  function pad(n) { return n < 10 ? '0' + n : String(n); }
  Array.prototype.forEach.call(document.querySelectorAll('[data-pk-timer]'), function (t) {
    var total = Math.max(0, Math.round((parseFloat(t.getAttribute('data-pk-timer')) || 0) * 60));
    var end = Date.now() + total * 1000;
    var out = t.querySelector('[data-pk-timer-value]') || t;
    function tick() {
      var left = Math.max(0, Math.round((end - Date.now()) / 1000));
      var h = Math.floor(left / 3600), m = Math.floor((left % 3600) / 60), s = left % 60;
      out.textContent = (h > 0 ? pad(h) + ':' : '') + pad(m) + ':' + pad(s);
      if (left > 0) setTimeout(tick, 1000);
    }
    tick();
  });

  if (steps.length <= 1) maybeTrigger();
})();
</script>
</body>
</html>
