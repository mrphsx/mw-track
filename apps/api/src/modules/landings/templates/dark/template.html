<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{META_TITLE}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 420px; width: 100%;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: {{PRIMARY_COLOR}}22;
      color: {{PRIMARY_COLOR}};
      border: 1px solid {{PRIMARY_COLOR}}44;
      border-radius: 20px;
      padding: 4px 14px; font-size: 12px; font-weight: 600;
      margin-bottom: 20px; letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .avatar {
      width: 72px; height: 72px; border-radius: 50%;
      border: 2px solid {{PRIMARY_COLOR}};
      object-fit: cover; margin: 0 auto 20px; display: block;
    }
    h1 { color: white; font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    p { color: #888; font-size: 14px; line-height: 1.7; margin-bottom: 28px; }
    .btn {
      display: block; width: 100%;
      background: {{PRIMARY_COLOR}};
      color: white; border: none; border-radius: 12px;
      padding: 15px 24px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; text-decoration: none;
    }
    .divider { height: 1px; background: #2a2a2a; margin: 24px 0; }
    .footer { color: #444; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Private channel</div>

    {{#if CHANNEL_AVATAR}}
    <img src="{{CHANNEL_AVATAR}}" alt="" class="avatar">
    {{/if}}

    <h1>{{CHANNEL_TITLE}}</h1>
    <p>{{CHANNEL_DESCRIPTION}}</p>

    <a href="{{TG_REDIRECT_URL}}"
       class="btn"
       rel="noopener"
       data-track="Lead">
      {{JOIN_BUTTON_TEXT}}
    </a>

    <div class="divider"></div>
    <div class="footer">{{SUBSCRIBERS_COUNT}} sbuscribers</div>
  </div>

  <!-- TRACKING_PLACEHOLDER -->
</body>
</html>
